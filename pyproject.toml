[project]
name = "modal-mcp-server"
version = "0.1.0"
description = "MCP server for Modal app and volume operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.5.0",
    "modal>=1.1.2",
    "pydantic>=2.10.6",
    "uv>=0.6.9",
]

[project.scripts]
modal-mcp-server = "modal_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modal_mcp"]
